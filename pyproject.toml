[project]
name = "fastapi-pycrossfade"
version = "0.1.0"
description = "A FastAPI music-library and beat-matched crossfade application."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosqlite>=0.22.1",
  "beat-this>=1.1.0",
  "essentia==2.1b6.dev1438",
  "fastapi[standard]>=0.141.1",
  "greenlet>=3.3.0",
  "numpy>=2.0",
  "pyrubberband>=0.4.0",
  "pydantic-settings>=2.12.0",
  "scipy>=1.15",
  "soundfile>=0.13",
  "sqlalchemy>=2.0.51",
  "yodel>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycrossfade"]
